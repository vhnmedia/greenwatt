name: Build single-file GreenWatt

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-single-html.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inline CSS and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          source = (root / 'index.html').read_text(encoding='utf-8')

          def inline_css(match):
              href = match.group(1)
              path = root / href
              if not path.exists():
                  return match.group(0)
              css = path.read_text(encoding='utf-8')
              return f'<style>\n/* Inlined from {href} */\n{css}\n</style>'

          def inline_js(match):
              src = match.group(1)
              path = root / src
              if not path.exists():
                  return match.group(0)
              js = path.read_text(encoding='utf-8')
              js = js.replace('</script>', '<\\/script>')
              return f'<script>\n/* Inlined from {src} */\n{js}\n</script>'

          source = re.sub(
              r'<link\s+rel=["\']stylesheet["\']\s+href=["\']([^"\']+)["\']\s*/?>',
              inline_css,
              source,
              flags=re.I,
          )
          source = re.sub(
              r'<script\s+src=["\']([^"\']+)["\']\s*>\s*</script>',
              inline_js,
              source,
              flags=re.I,
          )

          banner = '<!-- GreenWatt single-file build: HTML + CSS + JavaScript bundled together. -->\n'
          (root / 'greenwatt-single.html').write_text(banner + source, encoding='utf-8')
          PY

      - name: Upload single HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: greenwatt-single-html
          path: greenwatt-single.html
          if-no-files-found: error

      - name: Commit generated single HTML
        shell: bash
        run: |
          if git diff --quiet -- greenwatt-single.html && git ls-files --error-unmatch greenwatt-single.html >/dev/null 2>&1; then
            echo "Single-file build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greenwatt-single.html
          git commit -m "Build single-file GreenWatt HTML"
          git push
